<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · Mediterráneo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1E4FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --cobalt:#1E4FD8; --jade:#0F7A6C; --pom:#D6265A;
  --bg:#FBFBFC; --panel:#fff; --ink:#14161C; --ink2:#4A5060; --muted:#7A8194;
  --line:#E6E8EE; --line2:#F0F1F5; --ok:#0F7A6C; --warn:#B8791A; --bad:#D6265A;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 18px rgba(20,22,28,.05);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1116; --panel:#161922; --ink:#F2F3F7; --ink2:#B6BCCB; --muted:#828A9C;
    --line:#262B37; --line2:#1D212B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Archivo,'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans SC',
    'Hiragino Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.6; word-break:keep-all; overflow-wrap:break-word;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
a{color:var(--cobalt)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---- 잠금 화면 ---- */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.gate-card h1{font-size:19px;margin:14px 0 4px;letter-spacing:-.01em}
.gate-card p{color:var(--muted);font-size:13px;margin:0 0 18px}
.mk{width:34px;height:34px;color:var(--cobalt)}

/* ---- 헤더 ---- */
.ahead{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.ahead-in{display:flex;align-items:center;gap:14px;padding-block:12px}
.brandline{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
.brandline .mk{width:24px;height:24px}
.tagme{font-size:11px;font-weight:700;letter-spacing:.09em;color:#fff;background:var(--cobalt);
  padding:3px 7px;border-radius:5px}
.sp{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);
  background:var(--panel)}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:2px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:inherit;font-weight:600;padding:11px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--cobalt);border-bottom-color:var(--cobalt)}

main{padding:22px 0 80px}
h2.sec{font-size:16px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}

/* ---- 카드 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
  padding:18px;margin-bottom:18px}
.panel h3{font-size:14px;margin:0 0 10px}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}

/* ---- 표 ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:880px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--line2);font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;
  position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pname{font-weight:600;display:block;max-width:230px}
.pmeta{color:var(--muted);font-size:11.5px}
tr.edited td{background:color-mix(in srgb,var(--cobalt) 7%,transparent)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--cobalt) 45%,transparent);outline-offset:1px;border-color:var(--cobalt)}
input.s{width:88px;text-align:right;font-variant-numeric:tabular-nums}
input.xs{width:70px;text-align:right}
select.s{width:104px}
textarea{min-height:64px;resize:vertical}
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}

.btn{appearance:none;font:inherit;font-weight:600;border-radius:9px;padding:9px 15px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:2.5px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.pill.es{background:color-mix(in srgb,var(--cobalt) 12%,transparent);color:var(--cobalt)}
.pill.kr{background:color-mix(in srgb,var(--jade) 13%,transparent);color:var(--jade)}

ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:9px 0;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
ul.check li:last-child{border-bottom:0}
ul.check .t{flex:1}
ul.check .t b{display:block;font-size:13.5px}
ul.check .t span{color:var(--muted);font-size:12.5px}

/* ---- 저장 바 ---- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,22,28,.08)}
.savebar-in{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.savebar .msg{font-size:13px;color:var(--ink2);flex:1;min-width:170px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:7px}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.langgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:280px}
.lg{text-align:center;font-size:10.5px;font-weight:700;padding:3px 0;border-radius:5px;
  background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.lg.miss{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
/* ---- 상품 편집 ---- */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,22,28,.10)}
main{padding-bottom:96px}
details{border-top:1px solid var(--line2);padding-top:10px;margin-top:4px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-c,var(--cobalt));
  list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open] summary::before{content:"▾ "}
summary:focus-visible{outline:2px solid color-mix(in srgb,var(--cobalt) 50%,transparent);outline-offset:2px}
.fld.tl.auto > span{color:var(--warn)}
.fld.tl.auto input,.fld.tl.auto textarea{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));
  background:color-mix(in srgb,var(--warn) 5%,var(--panel))}
.autotag{font-size:10.5px;font-weight:700;background:color-mix(in srgb,var(--warn) 16%,transparent);
  color:var(--warn);padding:1.5px 6px;border-radius:999px;margin-left:5px}
.panel h3 .pill{vertical-align:2px;margin-left:4px}

/* ---- 사진·영상 ---- */
.drop{border:2px dashed var(--line);border-radius:13px;padding:26px 18px;text-align:center;cursor:pointer;
  display:grid;gap:5px;justify-items:center;transition:.15s;background:var(--bg)}
.drop:hover,.drop:focus-visible,.drop.over{border-color:var(--cobalt);background:color-mix(in srgb,var(--cobalt) 5%,var(--bg));outline:none}
.drop svg{width:26px;height:26px;fill:none;stroke:var(--cobalt);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:14px}
.drop span{font-size:12px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;margin-top:16px}
.shot{margin:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg);position:relative}
.shot.main{border-color:var(--cobalt);box-shadow:0 0 0 2px color-mix(in srgb,var(--cobalt) 20%,transparent)}
.shot img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line2)}
.shot figcaption{padding:6px 8px 0;font-size:11px;color:var(--muted);word-break:break-all}
.shot-b{display:flex;gap:4px;padding:7px 8px 8px}
.shot-b .btn{flex:1;padding:4px 0;font-size:11.5px}
.shot img[data-preview]{outline:2px dashed color-mix(in srgb,var(--warn) 60%,transparent);outline-offset:-2px}
.shot img[data-preview]+.mainbadge{background:var(--warn)}
.mainbadge{position:absolute;top:7px;left:7px;background:var(--cobalt);color:#fff;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:999px}
.vprev{margin-top:14px;max-width:520px}
.vprev iframe,.vprev video{width:100%;aspect-ratio:16/9;border:0;border-radius:11px;background:#0C0E16;display:block}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 안내·결제 탭 */
.fgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:700px){.fgrid3{grid-template-columns:1fr}}
.polcard{border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:12px;background:var(--bg)}
.polcard .fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.polcard input,.polcard textarea{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;color:inherit}
.polcard textarea{resize:vertical;line-height:1.6}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.note{background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
  border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink2);margin:0 0 14px}
.note b{color:var(--ink)}
@media(max-width:700px){
  .wrap{padding:0 14px}
  .ahead-in{gap:9px}
  .kpi .v{font-size:22px}
}
</style>
</head>
<body>

<!-- ================= 잠금 ================= -->
<div class="gate" id="gate">
  <div class="gate-card">
    <svg class="mk" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36V22a7 7 0 0 1 14 0v14"/><path d="M24 36V22a7 7 0 0 1 14 0v14"/><path d="M6 41h36"/></svg>
    <h1>관리자 대쉬보드</h1>
    <p>Mediterráneo</p>
    <label class="fld"><span>암호</span><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn primary" id="pwBtn" style="width:100%">열기</button>
    <p style="margin:14px 0 0;font-size:12px;line-height:1.6">처음 암호는 <b class="mono">euforia</b> 입니다. 들어간 뒤 <b>설정</b> 탭에서 바꾸세요.</p>
  </div>
</div>

<!-- ================= 본체 ================= -->
<div id="app" hidden>
<header class="ahead">
  <div class="wrap ahead-in">
    <span class="brandline">
      <svg class="mk" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36V22a7 7 0 0 1 14 0v14"/><path d="M24 36V22a7 7 0 0 1 14 0v14"/><path d="M6 41h36"/></svg>
      Mediterráneo
    </span>
    <span class="tagme">관리자</span>
    <span class="sp"></span>
    <a class="btn sm" href="index.html" target="_blank" rel="noopener">가게 화면 열기 ↗</a>
    <button class="btn sm" id="lockBtn">잠그기</button>
  </div>
  <div class="tabs"><div class="wrap tabs-in" id="tabs"></div></div>
</header>

<main><div class="wrap" id="view"></div></main>

<div class="savebar" id="savebar" hidden>
  <div class="wrap savebar-in">
    <span class="msg" id="saveMsg"></span>
    <button class="btn" id="revertBtn">되돌리기</button>
    <button class="btn primary" id="exportBtn">사이트에 올리기 →</button>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/policy.js"></script>
<script src="assets/media.js"></script>
<script>
(function () {
'use strict';

/* =========================================================================
   Mediterráneo — 관리자 대쉬보드

   이 대쉬보드는 가게와 세 갈래로 이어져 있습니다.
   1) 읽기 : assets/data.js 를 그대로 읽어 상품·브랜드·환율을 보여 줍니다.
   2) 미리보기 연동 : 여기서 고친 값은 이 브라우저에 저장되고,
                      가게 화면(index/shop/product…)이 즉시 그 값으로 보입니다.
                      아직 손님에게는 보이지 않습니다. 내 눈으로 먼저 확인하는 단계입니다.
   3) 정식 반영 : [data.js 내보내기] 로 새 data.js 를 받아
                  assets 폴더에 덮어쓰고 배포하면 모든 손님에게 반영됩니다.
   ========================================================================= */

var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var KEY = 'me_admin_v1', PWKEY = 'me_admin_pw', TOKKEY = 'me_admin_nf';
var SITE = 'https://symphonious-sundae-6ad00e.netlify.app';
var LANGS = window.LANGS.map(function (l) { return l[0]; });      // ko es en fr de it zh
var LANGNAME = {}; window.LANGS.forEach(function (l) { LANGNAME[l[0]] = l[1]; });
var CATS = ['food', 'wine', 'craft', 'home', 'fashion', 'beauty'];
var CATNAME = { food: '식품', wine: '와인·주류', craft: '공예', home: '리빙', fashion: '패션', beauty: '뷰티' };

var BASE_P = window.PRODUCTS, BASE_B = window.BRANDS;
/* 안내 문구 · 결제 수단 · 택배사 (policy.js) */
var BASE_POL  = window.POLICY     || { updated: '', pay: [], ship: [], cancel: [] };
var BASE_PAYM = window.PAYMETHODS || [];
var BASE_CARR = window.CARRIERS   || [];
var BASE_CT   = window.CONTACT    || { kakao: '', kakaoOn: true };
var BASE_SHIP = window.SHIPPING   || { perKg: 15, step: 1, minKg: 1 };
var BASE_FX = { base: window.FX.base, buffer: window.FX.buffer, at: window.FX.at, source: window.FX.source };

/* 저장된 변경분 */
var D = LS.get(KEY, null) || { p: {}, add: [], del: {}, auto: {}, fx: null, ts: null };
if (!D.p) D.p = {}; if (!D.add) D.add = [];
if (!D.del) D.del = {}; if (!D.auto) D.auto = {};

/* 안내 문구는 통째로 보관합니다 (항목이 늘고 줄기 때문에 조각으로 나누면 오히려 어긋납니다).
   손대기 전에는 null 이고, 한 번이라도 고치면 그때 복사본이 생깁니다. */
function clone(x) { return JSON.parse(JSON.stringify(x)); }
function polNow()  { return D.pol  || BASE_POL; }
function paymNow() { return D.paym || BASE_PAYM; }
function carrNow() { return D.carr || BASE_CARR; }
function ctNow()   { return D.ct   || BASE_CT; }
function shipNow() { return D.ship || BASE_SHIP; }
function polEdit()  { if (!D.pol)  D.pol  = clone(BASE_POL);  return D.pol; }
function paymEdit() { if (!D.paym) D.paym = clone(BASE_PAYM); return D.paym; }
function carrEdit() { if (!D.carr) D.carr = clone(BASE_CARR); return D.carr; }
function ctEdit()   { if (!D.ct)   D.ct   = clone(BASE_CT);   return D.ct; }
function shipEdit() { if (!D.ship) D.ship = clone(BASE_SHIP); return D.ship; }
function infoDirty() { return !!(D.pol || D.paym || D.carr || D.ct || D.ship); }

/* 새로 넣은 상품이 이미 data.js 에 들어갔는지 봅니다.
   올리고 나서 [정리]를 안 누르면 임시 저장소에 그대로 남아,
   data.js 의 정식 상품과 겹쳐 같은 상품이 두 개로 보입니다.
   이름으로 맞춰 보고 이미 올라간 것은 임시 목록에서 빼 줍니다. */
function keyOf(p) {
  var n = (p.name && (p.name.ko || p.name.en || p.name.es)) || '';
  return String(n).replace(/\s+/g, '').toLowerCase();
}
function alreadyLive(p) {
  var k = keyOf(p);
  if (!k) return false;
  for (var i = 0; i < BASE_P.length; i++) if (keyOf(BASE_P[i]) === k) return true;
  return false;
}
/* 아직 data.js 에 없는, 진짜로 새로운 것만 */
function pendingAdds() { return D.add.filter(function (p) { return !alreadyLive(p); }); }

/* 대쉬보드를 열 때 한 번 쓸어 냅니다 — 이미 올라간 것은 임시 목록에서 지웁니다. */
(function sweep() {
  var before = D.add.length;
  D.add = pendingAdds();
  if (D.add.length !== before) { D.ts = null; LS.set(KEY, D); }
})();

/* 변경분을 얹은 "지금 화면에 보이는" 상품 목록. 지운 상품은 빠집니다. */
function merged() {
  var out = [];
  BASE_P.forEach(function (p) {
    if (D.del[p.id]) return;
    var o = D.p[p.id];
    if (!o) { out.push(p); return; }
    var c = {}; for (var k in p) c[k] = p[k];
    for (var k2 in o) c[k2] = o[k2];
    out.push(c);
  });
  pendingAdds().forEach(function (p) { out.push(p); });
  return out;
}
function fxNow() {
  var f = D.fx || BASE_FX;
  return { base: +f.base, buffer: +f.buffer, at: f.at, source: f.source,
           rate: Math.round(+f.base * (1 + +f.buffer) * 10) / 10 };
}
function brand(id) { for (var i = 0; i < BASE_B.length; i++) if (BASE_B[i].id === id) return BASE_B[i]; return null; }
function baseById(id) { for (var i = 0; i < BASE_P.length; i++) if (String(BASE_P[i].id) === String(id)) return BASE_P[i]; return null; }
function getP(id) { var a = merged(); for (var i = 0; i < a.length; i++) if (String(a[i].id) === String(id)) return a[i]; return null; }
function same(a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }

/* 값 하나를 고쳐 둡니다. 원래 값과 같아지면 "고친 것" 목록에서 빼 줍니다. */
function setP(id, field, value) {
  var addP = D.add.filter(function (p) { return String(p.id) === String(id); })[0];
  if (addP) { addP[field] = value; save(); return; }
  var base = baseById(id);
  if (!base) return;
  if (!D.p[id]) D.p[id] = {};
  if (same(base[field], value)) {
    delete D.p[id][field];
    if (!Object.keys(D.p[id]).length) delete D.p[id];
  } else D.p[id][field] = value;
  save();
  if (field === 'imgs' || field === 'video' || field === 'img') MISS = null;   // 파일 확인을 다시 합니다
}
/* 사진 목록: 예전 img 한 장짜리도 함께 셉니다 */
function photosOf(p) {
  var a = (p.imgs && p.imgs.length) ? p.imgs.slice() : [];
  if (p.img && a.indexOf(p.img) < 0) a.unshift(p.img);
  return a;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function nm(p) { return p.name && (p.name.ko || p.name.en) || '(이름 없음)'; }
function krw(eur) { return Math.round(eur * fxNow().rate / 10) * 10; }
function won(n) { return '₩' + n.toLocaleString('ko-KR'); }
function dirty() { return Object.keys(D.p).length > 0 || pendingAdds().length > 0 || Object.keys(D.del).length > 0 || !!D.fx || infoDirty(); }
function save() {
  D.ts = new Date().toISOString().slice(0, 16).replace('T', ' ');
  LS.set(KEY, D); paintBar();
}
function toast(m) {
  var el = document.getElementById('toast');
  el.textContent = m; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 2000);
}

/* ---------- 점검 ----------
   막는 것(팔 수 없는 이유)과 아쉬운 것(팔리긴 하지만 채우면 더 좋은 것)을 나눕니다. */
function issues(p) {                       // 막는 것
  var out = [];
  if (!p.eur) out.push('가격 없음');
  if (!p.g) out.push('용량·무게 없음');
  if (!p.kg || parseFloat(p.kg) <= 0) out.push('배송 무게(kg) 없음 — 배송비 계산 불가');
  if (p.eur && !p.stock) out.push('재고 0');
  return out;
}
function softs(p) {                        // 아쉬운 것
  var out = [];
  if (!photosOf(p).length) out.push('사진 없음');
  var miss = missLangs(p);
  if (miss.length) out.push('번역 ' + miss.length + '개어 빠짐');
  return out;
}
function missLangs(p) {
  var out = [];
  LANGS.forEach(function (L) {
    var bad = !(p.name && p.name[L]) || !(p.tag && p.tag[L]) || !(p.desc && p.desc[L]);
    if (bad) out.push(L);
  });
  return out;
}
function ready(p) { return issues(p).length === 0; }

/* ---------- 사진 파일이 진짜 폴더에 있는지 확인 ----------
   data.js 는 사진을 가리키는데 파일이 폴더에 없으면 손님 화면에서 그림이 깨집니다.
   실제로 한 번 불러 보고 없는 것만 추려 줍니다. */
var MISS = null;                      // null=아직 확인 안 함, [] = 다 있음
var HAVE = {};                        // 그 중 보관함(이 브라우저)에는 들어 있는 것
function checkFiles(cb) {
  var P = merged(), want = [];
  P.forEach(function (p) {
    photosOf(p).forEach(function (s) { if (want.indexOf(s) < 0) want.push(s); });
    if (p.video && p.video.kind === 'file' && p.video.src && want.indexOf(p.video.src) < 0) want.push(p.video.src);
  });
  HAVE = {};
  if (!want.length) { MISS = []; cb && cb(MISS); return; }
  var left = want.length, miss = [];
  var finish = function () {
    /* 서버에 없는 파일이라도 보관함에 있으면 [반영·배포] 때 같이 올라갑니다.
       정말 사라진 파일과 구별해야 대표님이 헛걱정을 안 하십니다. */
    if (!miss.length) { MISS = miss; cb && cb(miss); return; }
    var n = miss.length;
    miss.forEach(function (path) {
      window.MEDIA.get(path)
        .then(function (rec) { if (rec && rec.data) HAVE[path] = 1; })
        .catch(function () {})
        .then(function () { if (--n === 0) { MISS = miss; cb && cb(miss); } });
    });
  };
  want.forEach(function (path) {
    fetch(path, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { if (!r.ok) miss.push(path); })
      .catch(function () { miss.push(path); })
      .then(function () { if (--left === 0) finish(); });
  });
}
function missSplit() {
  var soon = [], gone = [];
  (MISS || []).forEach(function (s) { (HAVE[s] ? soon : gone).push(s); });
  return { soon: soon, gone: gone };
}
function missBlock() {
  if (MISS === null) return '<div class="panel"><p class="hint" style="margin:0" id="missBox">사진 파일이 폴더에 들어 있는지 확인하는 중…</p></div>';
  if (!MISS.length) return '';
  var s = missSplit(), out = '';
  var listOf = function (arr, pill) {
    return '<ul class="check">' + arr.slice(0, 12).map(function (x) {
      return '<li><span class="pill ' + pill + '">' + (pill === 'bad' ? '없음' : '대기') + '</span>' +
        '<span class="t"><b class="mono">' + esc(x.split('/').pop()) + '</b>' +
        '<span class="mono">' + esc(x) + '</span></span></li>';
    }).join('') + '</ul>' +
    (arr.length > 12 ? '<p class="hint">…외 ' + (arr.length - 12) + '개</p>' : '');
  };

  /* 1) 아직 안 올린 새 사진 — 잘못된 것이 아닙니다. 배포 때 같이 올라갑니다. */
  if (s.soon.length) {
    out += '<div class="panel">' +
      '<h3>아직 사이트에 안 올라간 새 사진 ' + s.soon.length + '장</h3>' +
      '<p class="hint">대쉬보드에서 방금 넣은 사진입니다. 지금은 이 브라우저 보관함에만 있습니다. ' +
        '<b>[반영·배포]에서 [GitHub 에 바로 올리기]</b>를 누르면 상품 목록과 함께 자동으로 올라갑니다. ' +
        '따로 하실 일은 없습니다.</p>' +
      listOf(s.soon, 'es') +
      '<div class="row" style="margin-top:12px"><button class="btn" id="mDlMiss">파일로 내려받기 (예전 방식)</button>' +
      '<button class="btn" id="mRecheck">다시 확인</button></div></div>';
  }
  /* 2) 서버에도 보관함에도 없는 것 — 이건 진짜 문제입니다. */
  if (s.gone.length) {
    out += '<div class="panel" style="border-color:color-mix(in srgb,var(--bad) 45%,var(--line))">' +
      '<h3 style="color:var(--bad)">되찾을 수 없는 사진 ' + s.gone.length + '장</h3>' +
      '<p class="hint">상품은 이 사진을 가리키는데 서버에도, 이 브라우저 보관함에도 없습니다. ' +
        '이 상태로 배포하면 손님 화면에서 색 타일로 보입니다. 해당 상품을 열어 사진을 다시 넣어 주세요.</p>' +
      listOf(s.gone, 'bad') +
      '<div class="row" style="margin-top:12px"><button class="btn" id="mRecheck">다시 확인</button></div></div>';
  }
  return out;
}

function downloadMissing() {
  if (!MISS || !MISS.length) return toast('내려받을 것이 없습니다');
  buildDataJs();                       // 정식 번호로 바뀐 사진 이름을 미리 정해 둡니다
  var i = 0, done = 0, gone = [];
  (function step() {
    if (i >= MISS.length) {
      if (gone.length) toast(done + '개 내려받음 · ' + gone.length + '개는 보관함에도 없습니다');
      else toast(done + '개 내려받았습니다');
      return;
    }
    var path = MISS[i++];
    window.MEDIA.get(path).then(function (rec) {
      if (rec && rec.data) { window.MEDIA.download(rec.data, (RENAME[path] || path).split('/').pop()); done++; }
      else gone.push(path);
      setTimeout(step, 350);
    });
  })();

function takePhotos(files) {
  var p = getP(MSEL); if (!p) return;
  var busy = document.getElementById('mBusy');
  var list = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
  if (!list.length) return toast('사진 파일이 아닙니다');
  var ph = photosOf(p).slice();
  var used = {}; ph.forEach(function (s) { used[s] = 1; });
  var n = 0, saved = 0, was = 0, now = 0;

  busy.hidden = false; busy.textContent = '사진 ' + list.length + '장 줄이는 중…';

  (function step(i) {
    if (i >= list.length) {
      setP(p.id, 'imgs', ph);
      if (p.img && ph.indexOf(p.img) === 0) { /* 예전 img 는 그대로 두어도 됩니다 */ }
      busy.textContent = '끝났습니다 — ' + saved + '장 · ' +
        window.MEDIA.fmtBytes(was) + ' → ' + window.MEDIA.fmtBytes(now);
      render();
      setTimeout(function () { toast(saved + '장 넣었습니다'); }, 60);
      return;
    }
    busy.textContent = '사진 줄이는 중… (' + (i + 1) + '/' + list.length + ')';
    window.MEDIA.shrink(list[i], 1200, 0.82).then(function (r) {
      var path;
      do { n++; path = 'assets/img/' + p.id + '_' + (n < 10 ? '0' + n : n) + '.jpg'; } while (used[path]);
      used[path] = 1;
      return window.MEDIA.put(path, r.data, { bytes: r.bytes, w: r.w, h: r.h, product: String(p.id), type: 'img' })
        .then(function () { ph.push(path); saved++; was += r.was; now += r.bytes; });
    }).catch(function (e) {
      busy.textContent = '한 장을 건너뛰었습니다: ' + (e.message || '읽기 실패');
    }).then(function () { step(i + 1); });
  })(0);
}

    var i = 0;
    (function step() {
      if (i >= rows.length) { toast(rows.length + '개 내려받았습니다'); return; }
      var r = rows[i++];
      window.MEDIA.download(r.data, r.path.split('/').pop());
      setTimeout(step, 350);
    })();
  });
}

/* ---------- 자동 번역 ----------
   MyMemory 무료 번역 API 를 대표님 브라우저에서 직접 부릅니다. 열쇠(키) 가 필요 없습니다.
   기계 번역이라 초벌입니다 — 상품 설명처럼 파는 글은 반드시 눈으로 한 번 보셔야 합니다. */
var MM = { max: 480, code: { ko: 'ko-KR', es: 'es-ES', en: 'en-GB', fr: 'fr-FR', de: 'de-DE', it: 'it-IT', zh: 'zh-CN' } };
function mmOne(text, from, to) {
  var mail = LS.get('me_admin_mail', '');
  var u = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
          '&langpair=' + MM.code[from] + '|' + MM.code[to] + (mail ? '&de=' + encodeURIComponent(mail) : '');
  return fetch(u, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var out = j && j.responseData && j.responseData.translatedText;
    if (!out || /MYMEMORY WARNING|QUERY LENGTH|INVALID|QUOTA/i.test(out)) throw new Error(out || '실패');
    return out;
  });
}
/* 긴 글은 문장 단위로 잘라서 보내고 다시 이어 붙입니다 */
function mmText(text, from, to) {
  var parts = [], cur = '';
  text.split(/(?<=[.。!?])\s*/).forEach(function (s) {
    if ((cur + ' ' + s).length > MM.max) { if (cur) parts.push(cur); cur = s; }
    else cur = cur ? cur + ' ' + s : s;
  });
  if (cur) parts.push(cur);
  if (!parts.length) parts = [text];
  var out = [];
  return parts.reduce(function (chain, part) {
    return chain.then(function () {
      return mmOne(part, from, to).then(function (r) { out.push(r); });
    });
  }, Promise.resolve()).then(function () { return out.join(' '); });
}
function autoTranslate(key) {
  var msg = document.getElementById('trmsg_' + key);
  var srcEl = document.querySelector('[data-e="' + key + '"][data-l="ko"]');
  var text = (srcEl.value || '').trim();
  if (!text) { msg.textContent = '한국어 칸을 먼저 채워 주세요.'; return; }
  var targets = ['es', 'en', 'fr', 'de', 'it', 'zh'].filter(function (L) {
    var el = document.querySelector('[data-e="' + key + '"][data-l="' + L + '"]');
    return el && !el.value.trim();      // 이미 쓴 것은 건드리지 않습니다
  });
  if (!targets.length) { msg.textContent = '6개 언어가 이미 채워져 있습니다. 지우고 다시 누르면 새로 번역합니다.'; return; }

  var btn = document.querySelector('[data-tr="' + key + '"]');
  btn.disabled = true;
  var done = [], failed = [];
  msg.textContent = '번역하는 중… (0/' + targets.length + ')';
  targets.reduce(function (chain, L) {
    return chain.then(function () {
      return mmText(text, 'ko', L).then(function (r) {
        var el = document.querySelector('[data-e="' + key + '"][data-l="' + L + '"]');
        if (el) {
          el.value = r;
          /* 다시 그리지 않고 그 자리에서 "자동 · 검수 전" 표시를 붙입니다 */
          var f = el.closest('.fld');
          if (f && !f.classList.contains('auto')) {
            f.classList.add('auto');
            var sp = f.querySelector('span');
            if (sp && !sp.querySelector('.autotag')) sp.insertAdjacentHTML('beforeend', ' <b class="autotag">자동 · 검수 전</b>');
          }
        }
        done.push(L);
        msg.textContent = '번역하는 중… (' + done.length + '/' + targets.length + ')';
      }).catch(function () { failed.push(L); });
    });
  }, Promise.resolve()).then(function () {
    btn.disabled = false;
    if (!done.length) {
      msg.innerHTML = '<b style="color:var(--bad)">번역을 받아오지 못했습니다.</b> 회선이 막혔거나 오늘 무료 한도를 다 썼을 수 있습니다. ' +
        '아래 [클로드에게 번역 맡기기]를 쓰세요.';
      return;
    }
    var id = ESEL;
    if (!D.auto[id]) D.auto[id] = {};
    D.auto[id][key] = (D.auto[id][key] || []).concat(done);
    save();
    msg.innerHTML = '<b>' + done.length + '개 언어 채웠습니다.</b> 기계 번역이라 초벌입니다 — 눈으로 한 번 보시고 [검수 끝 표시]를 눌러 주세요.' +
      (failed.length ? ' (' + failed.join(', ') + ' 실패)' : '');
    var d = document.querySelector('[data-tr="' + key + '"]').closest('.panel').querySelector('details');
    if (d) d.open = true;
  });
}

function readEdit() {
  function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  var o = { hall: v('e_hall'), cat: v('e_cat'), brand: v('e_brand'),
            eur: v('e_eur') ? Math.round(parseFloat(v('e_eur')) * 100) / 100 : 0,
            g: v('e_g'), kg: parseFloat(v('e_kg')) || 0, stock: parseInt(v('e_stock'), 10) || 0,
            badge: v('e_badge'), origin: v('e_origin'), dop: v('e_dop') };
  FIELDS.forEach(function (f) { o[f.k] = {}; });
  document.querySelectorAll('[data-e]').forEach(function (el) {
    var val = el.value.trim(); if (!val) return;
    o[el.dataset.e][el.dataset.l] = val;
  });
  return o;
}
function saveEdit() {
  var o = readEdit();
  if (!o.name.ko && !o.name.en && !o.name.es) return toast('상품 이름을 하나 이상 넣어 주세요');
  if (!o.name.en) o.name.en = o.name.es || o.name.ko;
  if (o.eur < 0) return toast('가격은 0 이상이어야 합니다');

  if (ESEL === 'new') {
    var id = 'n' + (Date.now() % 100000);
    o.id = id; o.img = ''; o.imgs = [];
    D.add.push(o);
    /* 저장 전에 번역한 기록을 새 번호로 옮겨 둡니다 */
    if (D.auto['new']) { D.auto[id] = D.auto['new']; delete D.auto['new']; }
    save();
    ESEL = id; toast('새 상품을 넣었습니다');
    go('edit');
    return;
  }
  var cur = getP(ESEL);
  Object.keys(o).forEach(function (k) { if (!same(cur[k], o[k])) setP(ESEL, k, o[k]); });
  toast('저장했습니다');
  go('prod');
}

function delProduct(id, quiet) {
  var p = getP(id); if (!p) return;
  if (!quiet && !confirm('"' + nm(p) + '" 을 지웁니다.\n\n사이트에서 완전히 빠집니다. 잠깐 안 팔 것이면 [지우기] 대신 [숨기기]를 쓰세요.\n계속할까요?')) return;
  photosOf(p).forEach(function (s) { window.MEDIA.del(s); });
  if (p.video && p.video.kind === 'file') window.MEDIA.del(p.video.src);
  var ix = -1;
  D.add.forEach(function (x, i) { if (String(x.id) === String(id)) ix = i; });
  if (ix >= 0) D.add.splice(ix, 1);
  else { D.del[id] = true; delete D.p[id]; }
  delete D.auto[id];
  MISS = null; save();
  toast('지웠습니다');
  go('prod');
}

/* 손님에게 보이는 결제·배송·취소/환불 문구, 결제 수단, 택배사 목록을 여기서 고칩니다.
   글은 한국어·스페인어·영어만 채워도 됩니다 — 나머지 언어로 보는 손님에게는 영어가 나갑니다. */
var PSEC = [['pay', '결제'], ['ship', '배송'], ['cancel', '취소 · 반품 · 환불']];
var ISEC = 'pay';                       // 지금 보고 있는 갈래
var ILANG = 'ko';                       // 지금 고치고 있는 언어

function ptx(o) { return (o && (o[ILANG] || '')) || ''; }
/* 배송 무게가 아직 없는 상품 */
function noKg() { return merged().filter(function (p) { return !p.kg || parseFloat(p.kg) <= 0; }); }
/* 지금 규칙으로 얼마가 되는지 한 줄 예시 */
function shipEg(kg) {
  var sh = shipNow(), st = sh.step > 0 ? sh.step : 1;
  var b = Math.max(Math.ceil(kg / st) * st, sh.minKg > 0 ? sh.minKg : st);
  return kg + 'kg → €' + (Math.round(b * (sh.perKg || 15) * 100) / 100);
}

/* 안내 문구 편집 동작 */
function polSet(field, i, val) {
  var pol = polEdit(), r = pol[ISEC][i];
  if (!r) return;
  if (!r[field]) r[field] = {};
  r[field][ILANG] = val;
  save();
}
function polTranslate(i) {
  var r = polNow()[ISEC][i];
  if (!r) return;
  var src = (r.h && r.h.ko) || (r.h && r.h[ILANG]) || '';
  var srcB = (r.b && r.b.ko) || (r.b && r.b[ILANG]) || '';
  if (!src && !srcB) return toast('먼저 한국어로 써 주세요');
  var from = (r.h && r.h.ko) ? 'ko' : ILANG;
  var to = ['es', 'en'].filter(function (L) { return L !== from; });
  toast('번역하는 중…');
  var jobs = [];
  to.forEach(function (L) {
    if (src) jobs.push(mmOne(src, from, L).then(function (o) { polEdit()[ISEC][i].h[L] = o; }));
    if (srcB) jobs.push(mmOne(srcB, from, L).then(function (o) { polEdit()[ISEC][i].b[L] = o; }));
  });
  Promise.all(jobs).then(function () { save(); render(); toast('번역했습니다 — 눈으로 한 번 봐 주세요'); })
    .catch(function (err) { toast('번역 실패: ' + (err.message || '')); });
}

function buildPolicyJs() {
  var pol = clone(polNow());
  pol.updated = new Date().toISOString().slice(0, 10);

  L.push('/* Mediterráneo — 결제 · 배송 · 취소/환불 안내와 택배사 목록.');
  L.push('   관리자 대쉬보드 [안내·결제] 탭에서 내보냈습니다: ' + pol.updated + ' */');
  L.push('window.POLICY = ' + JSON.stringify(pol, null, 1) + ';');
  L.push('window.PAYMETHODS = ' + JSON.stringify(paymNow(), null, 1) + ';');
  L.push('window.SHIPPING = ' + JSON.stringify(shipNow()) + ';');
  L.push('window.CONTACT = ' + JSON.stringify(ctNow(), null, 1) + ';');
  L.push('window.CARRIERS = ' + JSON.stringify(carrNow(), null, 1) + ';');

}

/* 표 안에서 값 고치기 */
document.addEventListener('change', function (e) {
  var f = e.target.dataset && e.target.dataset.f;
  if (f) {
    var tr = e.target.closest('tr'); if (!tr) return;
    var id = tr.dataset.id;
    var v = e.target.value;
    if (f === 'eur') v = v === '' ? 0 : Math.round(parseFloat(v) * 100) / 100;
    if (f === 'stock') v = v === '' ? 0 : parseInt(v, 10) || 0;
    if (f === 'kg') v = v === '' ? 0 : Math.round((parseFloat(v) || 0) * 1000) / 1000;
    if (f === 'eur' && v < 0) { toast('가격은 0 이상이어야 합니다'); e.target.value = ''; v = 0; }

    var addP = D.add.filter(function (p) { return String(p.id) === String(id); })[0];
    if (addP) { addP[f] = v; }
    else {
      var base = null;
      for (var i = 0; i < BASE_P.length; i++) if (String(BASE_P[i].id) === String(id)) base = BASE_P[i];
      if (!base) return;
      if (!D.p[id]) D.p[id] = {};
      if (String(base[f] == null ? '' : base[f]) === String(v)) { delete D.p[id][f]; if (!Object.keys(D.p[id]).length) delete D.p[id]; }
      else D.p[id][f] = v;
    }
    save();
    /* 줄 전체를 다시 그리면 방금 고치던 칸에서 커서가 튕겨 나갑니다.
       바뀌어야 하는 칸(원화·상태)만 조용히 고쳐 씁니다. */
    var row = merged().filter(function (p) { return String(p.id) === String(id); })[0];
    if (row) {
      var tds = tr.children;
      if (tds[4]) tds[4].textContent = row.eur ? won(krw(row.eur)) : '—';
      if (tds[8]) tds[8].innerHTML =
        issues(row).map(function (s) { return '<span class="pill bad" style="margin:1px 2px 1px 0">' + s + '</span>'; }).join('') +
        softs(row).map(function (s) { return '<span class="pill warn" style="margin:1px 2px 1px 0">' + s + '</span>'; }).join('') +
        (issues(row).length || softs(row).length ? '' : '<span class="pill ok">완료</span>');
      if (D.p[id] || addP) tr.classList.add('edited'); else tr.classList.remove('edited');
    }
    return;
  }
  if (e.target.id === 'mSel') { MSEL = e.target.value; render(); return; }
  if (e.target.id === 'mFile') { takePhotos(e.target.files); e.target.value = ''; return; }
  if (e.target.id === 'mVfile') {

/* =========================================================================
   GitHub 로 바로 올리기

   이 사이트는 GitHub 저장소와 이어져 있습니다. main 가지에 파일이 바뀌면
   Netlify 가 알아서 새로 배포합니다. 그래서 여기서 파일을 밀어 넣으면
   내려받고 · 폴더에 옮기고 · 끌어다 놓는 세 단계가 통째로 사라집니다.

   한 번에 여러 파일을 "한 개의 커밋" 으로 올립니다.
   (파일마다 커밋하면 배포가 파일 수만큼 돌아 느려집니다.)
   ========================================================================= */
var GHKEY = 'me_admin_gh';
function ghCfg() {
  var c = LS.get(GHKEY, null) || {};
  return { repo: c.repo || 'euforia-jpg/symphonious-sundae-6ad00e',
           branch: c.branch || 'main', token: c.token || '' };
}
function ghSet(c) { LS.set(GHKEY, c); }
function ghOn() { return !!ghCfg().token; }

function gh(path, opt) {
  var c = ghCfg();
  opt = opt || {};
  opt.headers = Object.assign({
    'Authorization': 'Bearer ' + c.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  }, opt.headers || {});
  if (opt.body && typeof opt.body !== 'string') opt.body = JSON.stringify(opt.body);
  return fetch('https://api.github.com/repos/' + c.repo + path, opt).then(function (r) {
    if (r.status === 204) return null;
    return r.json().then(function (j) {
      if (!r.ok) {
        var msg = (j && j.message) || ('HTTP ' + r.status);
        if (r.status === 401) msg = '토큰이 맞지 않거나 만료됐습니다';
        if (r.status === 403) msg = '이 토큰에 쓰기 권한이 없습니다 (Contents: Read and write 필요)';
        if (r.status === 404) msg = '저장소나 가지를 찾지 못했습니다 — 저장소 이름과 토큰 범위를 확인해 주세요';
        var e = new Error(msg); e.status = r.status; throw e;
      }
      return j;
    });
  });
}
/* 한글이 섞인 글을 GitHub 가 받는 형식(base64)으로 바꿉니다 */
function b64(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

/* files = [{path, b64}] — 전부 한 커밋으로 */
function ghCommit(files, message, log) {
  var c = ghCfg(), baseSha, treeSha;
  log = log || function () {};
  log('저장소 상태를 읽는 중…');
  return gh('/git/ref/heads/' + encodeURIComponent(c.branch))
    .then(function (ref) {
      baseSha = ref.object.sha;
      return gh('/git/commits/' + baseSha);
    })
    .then(function (cm) {
      treeSha = cm.tree.sha;
      log('파일 ' + files.length + '개를 올리는 중…');
      var i = 0;
      return files.reduce(function (chain, f) {
        return chain.then(function (acc) {
          return gh('/git/blobs', { method: 'POST', body: { content: f.b64, encoding: 'base64' } })
            .then(function (b) {
              log('올리는 중… (' + (++i) + '/' + files.length + ') ' + f.path.split('/').pop());
              acc.push({ path: f.path, mode: '100644', type: 'blob', sha: b.sha });
              return acc;
            });
        });
      }, Promise.resolve([]));
    })
    .then(function (tree) {
      log('묶는 중…');
      return gh('/git/trees', { method: 'POST', body: { base_tree: treeSha, tree: tree } });
    })
    .then(function (t) {
      return gh('/git/commits', { method: 'POST', body: { message: message, tree: t.sha, parents: [baseSha] } });
    })
    .then(function (cm) {
      log('반영하는 중…');
      return gh('/git/refs/heads/' + encodeURIComponent(c.branch), { method: 'PATCH', body: { sha: cm.sha } })
        .then(function () { return cm; });
    });
}

/* 올리고 나면 보관함의 사진도 정식 이름으로 옮깁니다.
   보관함은 "서버 파일이 안 열릴 때 대신 보여 주는 예비본"이라, 이름이 어긋나면 소용이 없습니다. */
function renameStored(map) {

        return s.replace(/"id":\s*"?/, '').replace(/"$/, '');
      });
      var stamp = (txt.match(/내보냈습니다:\s*([0-9-]+)/) || txt.match(/판입니다:\s*([0-9-]+)/) || [])[1] || '';
      var willBe = merged().length;
      var same = ids.length === willBe;
      var localIds = merged().map(function (p) { return String(p.id); });
      var onlyLive = ids.filter(function (i) { return localIds.indexOf(i) < 0; });
      var onlyHere = localIds.filter(function (i) { return ids.indexOf(i) < 0; });

      box.innerHTML =
        '<div class="cards" style="margin-bottom:12px">' +
          '<div class="kpi ' + (same ? 'ok' : 'bad') + '"><div class="k">사이트에 올라간 상품</div>' +
            '<div class="v">' + ids.length + '</div><div class="n">' + (stamp ? '파일 날짜 ' + esc(stamp) : '지금 손님이 보는 것') + '</div></div>' +
          '<div class="kpi"><div class="k">내보내면 이렇게 됩니다</div>' +
            '<div class="v">' + willBe + '</div><div class="n">지금 대쉬보드 기준</div></div>' +
        '</div>' +
        (same
          ? '<div class="note" style="background:color-mix(in srgb,var(--ok) 9%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,transparent)">' +
            '<b>사이트가 최신입니다.</b> 대쉬보드와 사이트의 상품이 같습니다.</div>'
          : '<div class="note"><b>아직 반영되지 않았습니다.</b>' +
            (onlyLive.length ? ' 사이트에만 있는 상품: ' + esc(onlyLive.join(', ')) + '.' : '') +
            (onlyHere.length ? ' 사이트에 아직 없는 상품: ' + esc(onlyHere.join(', ')) + '.' : '') +
            ' 아래 순서대로 [data.js 내보내기] → <span class="mono">assets</span> 폴더에 덮어쓰기 → 배포 를 해 주세요.</div>');
    })
    .catch(function (err) {
      box.innerHTML = '<div class="note">확인하지 못했습니다 (' + esc(String(err.message || '')) + '). ' +
        '인터넷 연결이나 주소를 확인해 주세요.</div>';
    });
}

/* 이 기기에 저장된 화면을 싹 비웁니다 (앱으로 설치한 뒤 옛 화면이 남을 때) */
function clearSiteCache() {
  var done = function () {
    toast('저장된 화면을 비웠습니다 — 다시 불러옵니다');
    setTimeout(function () { location.reload(); }, 900);
  };
  if ('caches' in window) {
    caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }).then(function () {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.update(); });
          done();
        });
      } else done();
    }).catch(done);
  } else done();
}

/* ---------- data.js 내보내기 ---------- */
/* data.js 본문을 만듭니다. 내려받기와 GitHub 올리기가 같은 것을 씁니다. */
/* 새 상품은 등록하는 순간에는 임시 번호(n26586)를 씁니다. 사진 이름도 그 번호로 지어집니다.
   여기서 정식 번호를 받을 때 사진 이름까지 같이 바꿔 줍니다.
   안 그러면 36번 상품의 사진이 n26586_01.jpg 로 영영 남습니다. */
var RENAME = {};
function renumberMedia(c, oldId, newId) {
  var fix = function (s) {
    if (!s) return s;
    var pi = 'assets/img/' + oldId + '_';
    if (s.indexOf(pi) === 0) { var a = 'assets/img/' + newId + '_' + s.slice(pi.length); RENAME[s] = a; return a; }
    var pv = 'assets/video/' + oldId + '.';
    if (s.indexOf(pv) === 0) { var b = 'assets/video/' + newId + '.' + s.slice(pv.length); RENAME[s] = b; return b; }
    return s;
  };
  if (c.imgs && c.imgs.length) c.imgs = c.imgs.map(fix);
  if (c.img) c.img = fix(c.img);
  if (c.video && c.video.kind === 'file' && c.video.src) {
    var v = {}; for (var k in c.video) v[k] = c.video[k];
    v.src = fix(v.src); c.video = v;
  }
  return c;
}

function buildDataJs() {
  var P = merged(), f = fxNow();
  _next = 0; RENAME = {};                 // 두 번 만들어도 번호가 같아야 합니다
  var today = new Date().toISOString().slice(0, 10);
  var lines = [];
  lines.push('/* Mediterráneo — 상품 데이터.');
  lines.push('   관리자 대쉬보드에서 내보냈습니다: ' + today);
  lines.push('   이 파일을 assets 폴더에 덮어쓰고 배포하면 손님 화면에 반영됩니다. */');
  lines.push('window.BRANDS = [');
  BASE_B.forEach(function (b) { lines.push('  ' + JSON.stringify(b) + ','); });
  lines.push('];');
  lines.push('');
  lines.push('window.PRODUCTS = [');
  P.forEach(function (p) {
    var c = {}; for (var k in p) c[k] = p[k];
    if (String(c.id).indexOf('n') === 0) {                     // 새 상품에 정식 번호를 줍니다
      var was = String(c.id);
      c.id = nextId();
      c = renumberMedia(c, was, c.id);                         // 사진 이름도 같이
    }
    /* 빈 값은 파일에 넣지 않습니다 — 파일이 깔끔해야 나중에 손으로도 고칩니다 */
    if (!c.video) delete c.video;
    if (c.imgs && !c.imgs.length) delete c.imgs;
    if (c.imgs && c.imgs.length) c.img = c.imgs[0];            // 목록 화면은 img 한 장만 씁니다
    if (!c.img) delete c.img;
    if (!c.hidden) delete c.hidden;
    if (!c.dop) delete c.dop;
    if (!c.origin) delete c.origin;
    if (!c.badge) delete c.badge;
    lines.push('  ' + JSON.stringify(c) + ',');
  });
  lines.push('];');
  lines.push('');
  lines.push('/* 환율: 하나은행 매매기준율을 하루 한 번 받아 넣는 값 + 판매 버퍼 */');
  lines.push('window.FX = { base: ' + f.base + ', buffer: ' + f.buffer + ', at: ' + JSON.stringify(f.at) + ', source: ' + JSON.stringify(f.source) + ' };');
  lines.push('window.FX.rate = Math.round(window.FX.base * (1 + window.FX.buffer) * 10) / 10;');
  return lines.join('\n') + '\n';
}

function exportData() {
  var was = BASE_P.length, now = merged().length;
  if (now < was) {
    if (!confirm('내보낼 상품이 ' + was + '개 → ' + now + '개 입니다. (' + (was - now) + '개 줄어듦)\n\n' +
        '이 파일을 assets 폴더에 넣고 배포하면 사이트에서도 그만큼 사라집니다.\n' +
        '지운 상품은 [상품] 탭 맨 위에서 되살릴 수 있습니다.\n\n계속 내보낼까요?')) return;
  }
  var drop = function (text, name) {
    var blob = new Blob([text], { type: 'text/javascript;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };
  drop(buildDataJs(), 'data.js');
  if (infoDirty()) {                    // 안내 문구도 고쳤으면 같이 내려받습니다
    setTimeout(function () { drop(buildPolicyJs(), 'policy.js'); }, 600);
    toast('data.js 와 policy.js 를 내보냈습니다 — 둘 다 assets 폴더에 덮어써 주세요');
    return;
  }
  toast('내보냈습니다 — assets 폴더에 덮어쓴 뒤 [올린 뒤 정리]를 눌러 주세요');
}
var _next = 0;
function nextId() {
  if (!_next) { _next = 0; BASE_P.forEach(function (p) { if (+p.id > _next) _next = +p.id; }); }
  return ++_next;
}
