<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · Mercado Euforia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1E4FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --cobalt:#1E4FD8; --jade:#0F7A6C; --pom:#D6265A;
  --bg:#FBFBFC; --panel:#fff; --ink:#14161C; --ink2:#4A5060; --muted:#7A8194;
  --line:#E6E8EE; --line2:#F0F1F5; --ok:#0F7A6C; --warn:#B8791A; --bad:#D6265A;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 18px rgba(20,22,28,.05);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1116; --panel:#161922; --ink:#F2F3F7; --ink2:#B6BCCB; --muted:#828A9C;
    --line:#262B37; --line2:#1D212B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Archivo,'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans SC',
    'Hiragino Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.6; word-break:keep-all; overflow-wrap:break-word;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
a{color:var(--cobalt)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---- 잠금 화면 ---- */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.gate-card h1{font-size:19px;margin:14px 0 4px;letter-spacing:-.01em}
.gate-card p{color:var(--muted);font-size:13px;margin:0 0 18px}
.mk{width:34px;height:34px;color:var(--cobalt)}

/* ---- 헤더 ---- */
.ahead{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.ahead-in{display:flex;align-items:center;gap:14px;padding-block:12px}
.brandline{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
.brandline .mk{width:24px;height:24px}
.tagme{font-size:11px;font-weight:700;letter-spacing:.09em;color:#fff;background:var(--cobalt);
  padding:3px 7px;border-radius:5px}
.sp{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);
  background:var(--panel)}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:2px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:inherit;font-weight:600;padding:11px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--cobalt);border-bottom-color:var(--cobalt)}

main{padding:22px 0 80px}
h2.sec{font-size:16px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}

/* ---- 카드 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
  padding:18px;margin-bottom:18px}
.panel h3{font-size:14px;margin:0 0 10px}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}

/* ---- 표 ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:880px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--line2);font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;
  position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pname{font-weight:600;display:block;max-width:230px}
.pmeta{color:var(--muted);font-size:11.5px}
tr.edited td{background:color-mix(in srgb,var(--cobalt) 7%,transparent)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--cobalt) 45%,transparent);outline-offset:1px;border-color:var(--cobalt)}
input.s{width:88px;text-align:right;font-variant-numeric:tabular-nums}
input.xs{width:70px;text-align:right}
select.s{width:104px}
textarea{min-height:64px;resize:vertical}
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}

.btn{appearance:none;font:inherit;font-weight:600;border-radius:9px;padding:9px 15px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:2.5px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.pill.es{background:color-mix(in srgb,var(--cobalt) 12%,transparent);color:var(--cobalt)}
.pill.kr{background:color-mix(in srgb,var(--jade) 13%,transparent);color:var(--jade)}

ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:9px 0;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
ul.check li:last-child{border-bottom:0}
ul.check .t{flex:1}
ul.check .t b{display:block;font-size:13.5px}
ul.check .t span{color:var(--muted);font-size:12.5px}

/* ---- 저장 바 ---- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,22,28,.08)}
.savebar-in{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.savebar .msg{font-size:13px;color:var(--ink2);flex:1;min-width:170px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:7px}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.langgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:280px}
.lg{text-align:center;font-size:10.5px;font-weight:700;padding:3px 0;border-radius:5px;
  background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.lg.miss{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
  border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink2);margin:0 0 14px}
.note b{color:var(--ink)}
@media(max-width:700px){
  .wrap{padding:0 14px}
  .ahead-in{gap:9px}
  .kpi .v{font-size:22px}
}
</style>
</head>
<body>

<!-- ================= 잠금 ================= -->
<div class="gate" id="gate">
  <div class="gate-card">
    <svg class="mk" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36V22a7 7 0 0 1 14 0v14"/><path d="M24 36V22a7 7 0 0 1 14 0v14"/><path d="M6 41h36"/></svg>
    <h1>관리자 대쉬보드</h1>
    <p>Mercado Euforia</p>
    <label class="fld"><span>암호</span><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn primary" id="pwBtn" style="width:100%">열기</button>
    <p style="margin:14px 0 0;font-size:12px;line-height:1.6">처음 암호는 <b class="mono">euforia</b> 입니다. 들어간 뒤 <b>설정</b> 탭에서 바꾸세요.</p>
  </div>
</div>

<!-- ================= 본체 ================= -->
<div id="app" hidden>
<header class="ahead">
  <div class="wrap ahead-in">
    <span class="brandline">
      <svg class="mk" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36V22a7 7 0 0 1 14 0v14"/><path d="M24 36V22a7 7 0 0 1 14 0v14"/><path d="M6 41h36"/></svg>
      Mercado Euforia
    </span>
    <span class="tagme">관리자</span>
    <span class="sp"></span>
    <a class="btn sm" href="index.html" target="_blank" rel="noopener">가게 화면 열기 ↗</a>
    <button class="btn sm" id="lockBtn">잠그기</button>
  </div>
  <div class="tabs"><div class="wrap tabs-in" id="tabs"></div></div>
</header>

<main><div class="wrap" id="view"></div></main>

<div class="savebar" id="savebar" hidden>
  <div class="wrap savebar-in">
    <span class="msg" id="saveMsg"></span>
    <button class="btn" id="revertBtn">되돌리기</button>
    <button class="btn primary" id="exportBtn">data.js 내보내기</button>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script>
(function () {
'use strict';

/* =========================================================================
   Mercado Euforia — 관리자 대쉬보드

   이 대쉬보드는 가게와 세 갈래로 이어져 있습니다.
   1) 읽기 : assets/data.js 를 그대로 읽어 상품·브랜드·환율을 보여 줍니다.
   2) 미리보기 연동 : 여기서 고친 값은 이 브라우저에 저장되고,
                      가게 화면(index/shop/product…)이 즉시 그 값으로 보입니다.
                      아직 손님에게는 보이지 않습니다. 내 눈으로 먼저 확인하는 단계입니다.
   3) 정식 반영 : [data.js 내보내기] 로 새 data.js 를 받아
                  assets 폴더에 덮어쓰고 배포하면 모든 손님에게 반영됩니다.
   ========================================================================= */

var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var KEY = 'me_admin_v1', PWKEY = 'me_admin_pw', TOKKEY = 'me_admin_nf';
var LANGS = window.LANGS.map(function (l) { return l[0]; });      // ko es en fr de it zh
var LANGNAME = {}; window.LANGS.forEach(function (l) { LANGNAME[l[0]] = l[1]; });
var CATS = ['food', 'wine', 'craft', 'home', 'fashion', 'beauty'];
var CATNAME = { food: '식품', wine: '와인·주류', craft: '공예', home: '리빙', fashion: '패션', beauty: '뷰티' };

var BASE_P = window.PRODUCTS, BASE_B = window.BRANDS;
var BASE_FX = { base: window.FX.base, buffer: window.FX.buffer, at: window.FX.at, source: window.FX.source };

/* 저장된 변경분 */
var D = LS.get(KEY, null) || { p: {}, add: [], fx: null, ts: null };
if (!D.p) D.p = {}; if (!D.add) D.add = [];

/* 변경분을 얹은 "지금 화면에 보이는" 상품 목록 */
function merged() {
  var out = BASE_P.map(function (p) {
    var o = D.p[p.id];
    if (!o) return p;
    var c = {}; for (var k in p) c[k] = p[k];
    for (var k2 in o) c[k2] = o[k2];
    return c;
  });
  D.add.forEach(function (p) { out.push(p); });
  return out;
}
function fxNow() {
  var f = D.fx || BASE_FX;
  return { base: +f.base, buffer: +f.buffer, at: f.at, source: f.source,
           rate: Math.round(+f.base * (1 + +f.buffer) * 10) / 10 };
}
function brand(id) { for (var i = 0; i < BASE_B.length; i++) if (BASE_B[i].id === id) return BASE_B[i]; return null; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function nm(p) { return p.name && (p.name.ko || p.name.en) || '(이름 없음)'; }
function krw(eur) { return Math.round(eur * fxNow().rate / 10) * 10; }
function won(n) { return '₩' + n.toLocaleString('ko-KR'); }
function dirty() { return Object.keys(D.p).length > 0 || D.add.length > 0 || !!D.fx; }
function save() {
  D.ts = new Date().toISOString().slice(0, 16).replace('T', ' ');
  LS.set(KEY, D); paintBar();
}
function toast(m) {
  var el = document.getElementById('toast');
  el.textContent = m; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 2000);
}

/* ---------- 점검 ----------
   막는 것(팔 수 없는 이유)과 아쉬운 것(팔리긴 하지만 채우면 더 좋은 것)을 나눕니다. */
function issues(p) {                       // 막는 것
  var out = [];
  if (!p.eur) out.push('가격 없음');
  if (!p.g) out.push('용량·무게 없음');
  if (p.eur && !p.stock) out.push('재고 0');
  return out;
}
function softs(p) {                        // 아쉬운 것
  var out = [];
  if (!p.img) out.push('사진 없음');
  var miss = missLangs(p);
  if (miss.length) out.push('번역 ' + miss.length + '개어 빠짐');
  return out;
}
function missLangs(p) {
  var out = [];
  LANGS.forEach(function (L) {
    var bad = !(p.name && p.name[L]) || !(p.tag && p.tag[L]) || !(p.desc && p.desc[L]);
    if (bad) out.push(L);
  });
  return out;
}
function ready(p) { return issues(p).length === 0; }

/* =========================== 탭 =========================== */
var TABS = [
  ['home',  '요약'],
  ['prod',  '상품'],
  ['add',   '상품 추가'],
  ['lang',  '번역'],
  ['fx',    '환율'],
  ['order', '주문'],
  ['deploy','반영·배포'],
  ['set',   '설정']
];
var TAB = location.hash.replace('#', '') || 'home';
if (!TABS.some(function (t) { return t[0] === TAB; })) TAB = 'home';

function paintTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === TAB) + '">' + t[1] + '</button>';
  }).join('');
}
function paintBar() {
  var bar = document.getElementById('savebar');
  if (!dirty()) { bar.hidden = true; return; }
  bar.hidden = false;
  var n = Object.keys(D.p).length, a = D.add.length;
  var bits = [];
  if (n) bits.push('상품 ' + n + '개 수정');
  if (a) bits.push('새 상품 ' + a + '개');
  if (D.fx) bits.push('환율 변경');
  document.getElementById('saveMsg').innerHTML =
    '<span class="dot"></span><b>' + bits.join(' · ') + '</b> — 지금은 <b>내 브라우저에서만</b> 보입니다. 손님에게 반영하려면 내보내서 배포하세요.';
}

/* =========================== 화면 =========================== */
function view(html) { document.getElementById('view').innerHTML = html; }

/* ---------- 요약 ---------- */
function vHome() {
  var P = merged(), f = fxNow();
  var live = P.filter(ready), es = P.filter(function (p) { return p.hall === 'es'; });
  var noPrice = P.filter(function (p) { return !p.eur; });
  var noImg = P.filter(function (p) { return !p.img; });
  var oos = P.filter(function (p) { return p.eur && !p.stock; });
  var low = P.filter(function (p) { return p.eur && p.stock > 0 && p.stock <= 5; });
  var tr = P.filter(function (p) { return missLangs(p).length; });

  function kpi(k, v, n, cls) {
    return '<div class="kpi ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="n">' + n + '</div></div>';
  }
  var rows = [
    ['가격이 아직 없는 상품', noPrice, 'prod', '생산자에게 가격과 용량을 받아 넣으면 바로 팔 수 있습니다.'],
    ['사진이 없는 상품', noImg, 'prod', '사진 없이도 열리지만, 사진이 있는 상품이 훨씬 잘 팔립니다.'],
    ['번역이 빠진 상품', tr, 'lang', '빠진 언어는 영어로 대신 보입니다. 채우면 그 나라 손님에게 그 나라 말로 보입니다.'],
    ['품절(재고 0)', oos, 'prod', '재고 0이면 손님이 담을 수는 있어도 보내 줄 수 없습니다.'],
    ['재고 5개 이하', low, 'prod', '곧 채워 두세요.']
  ].filter(function (r) { return r[1].length; });

  view(
    '<h2 class="sec">요약</h2><p class="sub">' + (D.ts ? '마지막 수정 ' + esc(D.ts) : '아직 수정한 내용이 없습니다') + '</p>' +
    '<div class="cards">' +
      kpi('전체 상품', P.length, es.length + ' · Shop Spain / ' + (P.length - es.length) + ' · Shop Korea') +
      kpi('지금 팔 수 있음', live.length, '가격·용량·재고가 모두 있는 상품', live.length === P.length ? 'ok' : '') +
      kpi('아직 못 파는 것', P.length - live.length, '가격이나 재고가 비어 있습니다', (P.length - live.length) ? 'bad' : 'ok') +
      kpi('브랜드', BASE_B.length, '생산자 수') +
      kpi('적용 환율', '₩' + f.rate.toLocaleString('ko-KR'), '€1 · 버퍼 ' + Math.round(f.buffer * 100) + '%') +
      kpi('환율 기준일', '<span style="font-size:19px">' + esc(String(f.at).slice(0, 10)) + '</span>', esc(f.source)) +
    '</div>' +
    (rows.length
      ? '<div class="panel"><h3>지금 손볼 것</h3><ul class="check">' + rows.map(function (r) {
          return '<li><span class="pill ' + (r[1].length > 5 ? 'bad' : 'warn') + '">' + r[1].length + '</span>' +
            '<span class="t"><b>' + r[0] + '</b><span>' + r[3] + '</span></span>' +
            '<button class="btn sm" data-goto="' + r[2] + '">보기</button></li>';
        }).join('') + '</ul></div>'

    '<div class="note"><b>왜 한 번에 자동으로 안 올라가나요?</b> 이 사이트는 서버 없이 파일만으로 도는 구조라 빠르고 공짜이지만, 브라우저에서 곧장 서버 파일을 고칠 수는 없습니다. 지금 회사 네트워크에서 Netlify 배포 API 가 막혀 있어 제가 대신 올려 드리지도 못합니다. 주문이 늘어 매일 값을 바꾸게 되면, 그때 서버가 있는 구조(관리자 로그인 + 데이터베이스)로 옮기는 것이 맞습니다.</div>'
  );
}

/* ---------- 설정 ---------- */
function vSet() {
  view(
    '<h2 class="sec">설정</h2><p class="sub"></p>' +
    '<div class="panel"><h3>암호 바꾸기</h3>' +
      '<p class="hint">이 암호는 이 브라우저에 저장되는 <b>가벼운 잠금</b>입니다. 주소를 아는 사람이 소스를 열면 볼 수 있으니, 진짜로 막으려면 Netlify 의 사이트 암호 보호(Password protection)를 켜세요.</p>' +
      '<div class="grid2">' +
      '<label class="fld"><span>새 암호</span><input type="password" id="np1"></label>' +
      '<label class="fld"><span>한 번 더</span><input type="password" id="np2"></label></div>' +
      '<button class="btn primary" id="pwSave">바꾸기</button></div>' +
    '<div class="panel"><h3>지금 읽고 있는 데이터</h3>' +
      '<ul class="check">' +
      '<li><span class="t"><b>assets/data.js</b><span>상품 ' + BASE_P.length + '개 · 브랜드 ' + BASE_B.length + '개</span></span></li>' +
      '<li><span class="t"><b>기준 환율</b><span>₩' + BASE_FX.base.toLocaleString('ko-KR') + ' · ' + esc(BASE_FX.source) + ' · ' + esc(BASE_FX.at) + '</span></span></li>' +
      '<li><span class="t"><b>주소</b><span class="mono">' + esc(location.origin + location.pathname) + '</span></span></li>' +
      '</ul></div>' +
    '<div class="panel"><h3>임시 변경 모두 지우기</h3>' +
      '<p class="hint">이 브라우저에 저장된 수정·추가·환율 변경을 지우고 data.js 그대로 되돌립니다. 배포된 사이트는 건드리지 않습니다.</p>' +
      '<button class="btn danger" id="wipeBtn">모두 지우기</button></div>'
  );
}

/* =========================== 그리기 =========================== */
function render() {
  paintTabs(); paintBar();
  ({ home: vHome, prod: vProd, add: vAdd, lang: vLang, fx: vFx, order: vOrder, deploy: vDeploy, set: vSet }[TAB])();
  window.scrollTo(0, 0);
}
function go(tab) { TAB = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} render(); }

/* =========================== 동작 =========================== */
document.addEventListener('click', function (e) {
  var tb = e.target.closest('[data-tab]'); if (tb) return go(tb.dataset.tab);
  var gt = e.target.closest('[data-goto]'); if (gt) return go(gt.dataset.goto);

  if (e.target.id === 'lockBtn') { LS.set('me_admin_open', false); location.reload(); return; }
  if (e.target.id === 'revertBtn' || e.target.id === 'wipeBtn') {
    if (!confirm('이 브라우저에 저장된 수정 내용을 모두 지웁니다. 계속할까요?')) return;
    D = { p: {}, add: [], fx: null, ts: null }; LS.del(KEY); render(); toast('되돌렸습니다'); return;
  }
  if (e.target.id === 'exportBtn' || e.target.id === 'dlBtn') { exportData(); return; }
  if (e.target.id === 'clearBtn') {
    if (!confirm('배포한 사이트에서 값이 제대로 보이는지 확인하셨나요? 확인했다면 임시 변경을 지웁니다.')) return;
    D = { p: {}, add: [], fx: null, ts: null }; LS.del(KEY); render(); toast('정리했습니다'); return;
  }

  /* 환율 */
  if (e.target.id === 'fxSave') {
    var base = parseFloat(document.getElementById('fx_base').value);
    var buf = parseFloat(document.getElementById('fx_buf').value) / 100;
    if (!(base > 500 && base < 4000)) return toast('기준환율이 이상합니다 (500~4000)');
    if (!(buf >= 0 && buf < 0.3)) return toast('버퍼는 0~30% 사이로 넣으세요');
    D.fx = { base: base, buffer: Math.round(buf * 1000) / 1000,
             at: document.getElementById('fx_at').value.trim(),
             source: document.getElementById('fx_src').value.trim() };
    save(); render(); toast('환율을 적용했습니다');
    return;
  }
  if (e.target.id === 'fxReset') { D.fx = null; save(); render(); toast('원래 환율로 되돌렸습니다'); return; }
  if (e.target.id === 'fxFetch') { fetchRate(); return; }

  /* 주문 */
  if (e.target.id === 'nfLoad') { loadOrders(); return; }
  if (e.target.id === 'nfClear') { LS.del(TOKKEY); document.getElementById('nfTok').value = ''; toast('토큰을 지웠습니다'); return; }

  /* 상품 추가 */
  if (e.target.id === 'addBtn') { addProduct(); return; }

  /* 암호 */
  if (e.target.id === 'pwSave') {
    var a = document.getElementById('np1').value, b2 = document.getElementById('np2').value;
    if (a.length < 4) return toast('4자 이상으로 정해 주세요');
    if (a !== b2) return toast('두 칸이 다릅니다');
    LS.set(PWKEY, a); document.getElementById('np1').value = ''; document.getElementById('np2').value = '';
    toast('암호를 바꿨습니다');
    return;
  }
});

/* 표 안에서 값 고치기 */
document.addEventListener('change', function (e) {
  var f = e.target.dataset && e.target.dataset.f;
  if (f) {
    var tr = e.target.closest('tr'); if (!tr) return;
    var id = tr.dataset.id;
    var v = e.target.value;
    if (f === 'eur') v = v === '' ? 0 : Math.round(parseFloat(v) * 100) / 100;
    if (f === 'stock') v = v === '' ? 0 : parseInt(v, 10) || 0;
    if (f === 'eur' && v < 0) { toast('가격은 0 이상이어야 합니다'); e.target.value = ''; v = 0; }

    var addP = D.add.filter(function (p) { return String(p.id) === String(id); })[0];
    if (addP) { addP[f] = v; }
    else {
      var base = null;
      for (var i = 0; i < BASE_P.length; i++) if (String(BASE_P[i].id) === String(id)) base = BASE_P[i];
      if (!base) return;
      if (!D.p[id]) D.p[id] = {};
      if (String(base[f] == null ? '' : base[f]) === String(v)) { delete D.p[id][f]; if (!Object.keys(D.p[id]).length) delete D.p[id]; }
      else D.p[id][f] = v;
    }
    save();
    /* 줄 전체를 다시 그리면 방금 고치던 칸에서 커서가 튕겨 나갑니다.
       바뀌어야 하는 칸(원화·상태)만 조용히 고쳐 씁니다. */
    var row = merged().filter(function (p) { return String(p.id) === String(id); })[0];
    if (row) {
      var tds = tr.children;
      if (tds[4]) tds[4].textContent = row.eur ? won(krw(row.eur)) : '—';
      if (tds[8]) tds[8].innerHTML =
        issues(row).map(function (s) { return '<span class="pill bad" style="margin:1px 2px 1px 0">' + s + '</span>'; }).join('') +
        softs(row).map(function (s) { return '<span class="pill warn" style="margin:1px 2px 1px 0">' + s + '</span>'; }).join('') +
        (issues(row).length || softs(row).length ? '' : '<span class="pill ok">완료</span>');
      if (D.p[id] || addP) tr.classList.add('edited'); else tr.classList.remove('edited');
    }
    return;
  }
  if (['fq', 'fhall', 'fcat', 'fonly'].indexOf(e.target.id) >= 0) {
    FILT.q = document.getElementById('fq').value;
    FILT.hall = document.getElementById('fhall').value;
    FILT.cat = document.getElementById('fcat').value;
    FILT.only = document.getElementById('fonly').value;
    vProd();
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'fq') { clearTimeout(window._q); window._q = setTimeout(function () {
    FILT.q = document.getElementById('fq').value; vProd();
    var el = document.getElementById('fq'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 260); }
});

/* ---------- 상품 추가 ---------- */
function addProduct() {
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  var name = {}, tag = {}, desc = {};
  document.querySelectorAll('[data-a]').forEach(function (el) {
    var v = el.value.trim(); if (!v) return;
    ({ name: name, tag: tag, desc: desc })[el.dataset.a][el.dataset.l] = v;
  });
  if (!name.ko && !name.es && !name.en) return toast('이름을 하나 이상 넣어 주세요');
  if (!name.en) name.en = name.es || name.ko;
  if (!tag.en) tag.en = tag.es || tag.ko || '';
  if (!desc.en) desc.en = desc.es || desc.ko || '';

  var id = 'n' + (Date.now() % 100000);
  D.add.push({
    id: id, hall: val('a_hall'), cat: val('a_cat'), brand: val('a_brand'),
    eur: val('a_eur') ? Math.round(parseFloat(val('a_eur')) * 100) / 100 : 0,
    g: val('a_g'), stock: parseInt(val('a_stock'), 10) || 0,
    badge: val('a_badge'), origin: val('a_origin'), img: val('a_img'),
    name: name, tag: tag, desc: desc
  });
  save();
  toast('추가했습니다. 상품 목록에서 확인하세요');
  go('prod');
}

/* ---------- 오늘 환율 받아오기 ----------
   브라우저에서 바로 부릅니다. 막히는 회선이면 조용히 실패하고 직접 넣으라고 안내합니다. */
function fetchRate() {
  var msg = document.getElementById('fxMsg');
  msg.textContent = '받아오는 중…';
  var srcs = [
    { url: 'https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWEUR',
      pick: function (j) { return j && j[0] && j[0].basePrice; }, name: '하나은행 매매기준율' },
    { url: 'https://open.er-api.com/v6/latest/EUR',
      pick: function (j) { return j && j.rates && j.rates.KRW; }, name: 'open.er-api.com' }
  ];
  (function next(i) {
    if (i >= srcs.length) { msg.textContent = '자동으로 받아오지 못했습니다. 위 칸에 직접 넣어 주세요.'; return; }
    fetch(srcs[i].url, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var v = srcs[i].pick(j);
        if (!(v > 500 && v < 4000)) throw new Error('range');
        document.getElementById('fx_base').value = Math.round(v * 100) / 100;
        document.getElementById('fx_src').value = srcs[i].name;
        document.getElementById('fx_at').value = new Date().toISOString().slice(0, 16).replace('T', ' ');
        msg.textContent = '받아왔습니다 — [적용]을 눌러야 저장됩니다.';
      })
      .catch(function () { next(i + 1); });
  })(0);
}

/* ---------- 주문 불러오기 ---------- */
var FORM_ID = '6a91ed3807b05d000836b3e4';
function loadOrders() {
  var tok = document.getElementById('nfTok').value.trim();
  var msg = document.getElementById('nfMsg'), out = document.getElementById('nfOut');
  if (!tok) { msg.textContent = '토큰을 먼저 넣어 주세요.'; return; }
  LS.set(TOKKEY, tok);
  msg.textContent = '불러오는 중…'; out.innerHTML = '';
  fetch('https://api.netlify.com/api/v1/forms/' + FORM_ID + '/submissions?per_page=50',
        { headers: { Authorization: 'Bearer ' + tok } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (list) {
      msg.textContent = list.length + '건';
      if (!list.length) { out.innerHTML = '<p class="hint">아직 들어온 주문이 없습니다.</p>'; return; }
      out.innerHTML = '<div class="tblwrap"><table><thead><tr><th style="width:130px">받은 때</th><th style="width:110px">성함</th>' +
        '<th style="width:96px">합계</th><th style="width:96px">배송국가</th><th>주문내역</th><th style="width:150px">연락</th></tr></thead><tbody>' +
        list.map(function (s) {
          var d = s.data || {};
          return '<tr><td class="pmeta">' + esc(String(s.created_at).slice(0, 16).replace('T', ' ')) + '</td>' +
            '<td>' + esc(d['성함'] || '') + '</td><td class="num">' + esc(d['합계'] || '') + '</td>' +
            '<td>' + esc(d['배송국가'] || '') + '</td>' +
            '<td class="pmeta">' + esc(d['주문내역'] || '') + '</td>' +
            '<td class="pmeta">' + esc(d['이메일'] || '') + '<br>' + esc(d['연락처'] || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    })
    .catch(function (err) {
      msg.textContent = '';
      out.innerHTML = '<div class="note">불러오지 못했습니다' +
        (String(err.message) === '401' ? ' — 토큰이 맞지 않습니다.' :
         String(err.message) === '404' ? ' — 주문 양식을 찾지 못했습니다.' :
         '. 회선이 Netlify API 를 막고 있을 수 있습니다.') +
        ' 위의 <b>Netlify 주문함 열기</b>로 보시면 확실합니다.</div>';
    });
}

/* ---------- data.js 내보내기 ---------- */
function exportData() {
  var P = merged(), f = fxNow();
  var today = new Date().toISOString().slice(0, 10);
  var lines = [];
  lines.push('/* Mercado Euforia — 상품 데이터.');
  lines.push('   관리자 대쉬보드에서 내보냈습니다: ' + today);
  lines.push('   이 파일을 assets 폴더에 덮어쓰고 배포하면 손님 화면에 반영됩니다. */');
  lines.push('window.BRANDS = [');
  BASE_B.forEach(function (b) { lines.push('  ' + JSON.stringify(b) + ','); });
  lines.push('];');
  lines.push('');
  lines.push('window.PRODUCTS = [');
  P.forEach(function (p) {
    var c = {}; for (var k in p) c[k] = p[k];
    if (String(c.id).indexOf('n') === 0) c.id = nextId();      // 새 상품에 정식 번호를 줍니다
    lines.push('  ' + JSON.stringify(c) + ',');
  });
  lines.push('];');
  lines.push('');
  lines.push('/* 환율: 하나은행 매매기준율을 하루 한 번 받아 넣는 값 + 판매 버퍼 */');
  lines.push('window.FX = { base: ' + f.base + ', buffer: ' + f.buffer + ', at: ' + JSON.stringify(f.at) + ', source: ' + JSON.stringify(f.source) + ' };');
  lines.push('window.FX.rate = Math.round(window.FX.base * (1 + window.FX.buffer) * 10) / 10;');
  var text = lines.join('\n') + '\n';

  var blob = new Blob([text], { type: 'text/javascript;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'data.js';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('내보냈습니다 — assets 폴더에 덮어쓰세요');
}
var _next = 0;
function nextId() {
  if (!_next) { _next = 0; BASE_P.forEach(function (p) { if (+p.id > _next) _next = +p.id; }); }
  return ++_next;
}

/* =========================== 잠금 =========================== */
function unlock() {
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  render();
}
document.getElementById('pwBtn').addEventListener('click', function () {
  var want = LS.get(PWKEY, 'euforia');
  if (document.getElementById('pw').value === want) { LS.set('me_admin_open', true); unlock(); }
  else { toast('암호가 다릅니다'); document.getElementById('pw').select(); }
});
document.getElementById('pw').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('pwBtn').click();
});
if (LS.get('me_admin_open', false)) unlock();
else document.getElementById('pw').focus();

})();
</script>
