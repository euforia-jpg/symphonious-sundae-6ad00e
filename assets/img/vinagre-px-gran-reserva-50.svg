<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Balsamic vinegar bottle illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98F3F"/>
      <stop offset="1" stop-color="#8A5A22"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1E17"/>
      <stop offset="1" stop-color="#25100C"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- bottle -->
  <g>
    <path d="M150 320 V210 C150 190 168 182 176 168 V124 H224 V168 C232 182 250 190 250 210 V320 A12 12 0 0 1 238 332 H162 A12 12 0 0 1 150 320 Z"
          fill="url(#liq)" stroke="rgba(255,255,255,.9)" stroke-width="4" stroke-linejoin="round"/>
    <rect x="172" y="76" width="56" height="50" rx="9" fill="#1B1B22" stroke="rgba(255,255,255,.9)" stroke-width="4"/>
    <rect x="170" y="118" width="60" height="9" rx="4" fill="#1B1B22"/>
    <rect x="158" y="226" width="84" height="74" rx="3" fill="#EFE7D2" stroke="rgba(0,0,0,.12)" stroke-width="1.5"/>
    <rect x="170" y="244" width="60" height="3" rx="1.5" fill="#8A5A22" opacity=".7"/>
    <rect x="170" y="256" width="42" height="3" rx="1.5" fill="#8A5A22" opacity=".45"/>
    <rect x="170" y="276" width="30" height="10" rx="2" fill="#8A5A22" opacity=".8"/>
  </g>

  <text x="200" y="372" text-anchor="middle" font-family="Archivo, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="2.4" fill="rgba(255,255,255,.92)">ILUSTRACIÓN</text>
</svg>
